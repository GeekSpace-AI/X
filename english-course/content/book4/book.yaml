continue_prompt: |
  你是一名在中国长期生活、熟悉中美文化的资深英语教育专家和课程设计师。请按照《中文思维桥接英语 · 180 天课程》的既定体系，续写【第五册：Day 121–150 自然口语、短语、语音变化、情境故事和短剧理解】。

  一、必须沿用的体系（与前四册完全一致）
  1. 每天 120 分钟，8 步：旧知识情境复习 10 → 中文意图到英语表达 15 → 微故事与词汇 25 → 语音 15 → 听力 15 → 开口 20 → 输出 12 → 复盘 8（Day 127 / 134 / 141 / 150 为阶段复习日，用复习日的 8 步结构）。每步写明具体操作。
  2. 每课结构 A–I：A 今日目标；B 中文场景导入（人物关系、沟通目的、已知信息、表达重点）；C 原创短剧 / 对话，逐句配自然中文，句子编号 S1、S2…；D 按出现顺序的词汇注释（原文形式、原形、词性、美式 IPA、语境语义、使用场景、1–3 个常用搭配、英文例句 + 中文、中国学习者易错点、位置 S#）；E 3–4 组「中文怎么想 → 英文怎么说」；F 6–8 个核心表达；G 语音与听力（重点：弱读、连读、吞音、缩读）；H 口语三层（模仿 → 替换 → 只给中文情境的自主表达）+ 今日输出；I 检测题（前 2 题为听力题）+ 答案 + 完成清单 + 明日复习 + 七日后复习。
  3. 每天约 16 个重点词 + 6 个短语（短语动词为主），全部自然地出现在当天的文本里；文本约 250–300 词。
  4. 听力：第一遍不看文字，第二遍看英文；关注语气、反应和言外之意；中文只对难句出现。
  5. 复习日：用旧词写新情境（复现词标注首次学习日）、中文意思组织英文、短对话听力、不看原文复述、易混表达检查、下阶段改善建议。Day 150 提供阶段成果评估、薄弱项目记录和第六册衔接记录。

  二、与前四册的衔接（附件为前四册的 Markdown 源文件，请先读四册的附录 1、2、4）
  1. 四册附录 1 中已注释过的词和短语不再作为新词完整注释，只在新语境中复现，并标注首次学习日。
  2. 第四册的薄弱项目（转述的时态和语序、suggest / recommend 的句型、The reason is that、if 从句不用 will、观点的强弱、邮件语气的分寸）要在第五册的热身、练习和复习日中有计划地反复出现。
  3. 继续使用 SwiftLink 的人物：林晓、张涛、Emma、吴佳、李凯、西雅图的 Mike、实习生 Leo，林晓的朋友 Mei；第五册转向更口语、更生活化的原创短剧。

  三、第五册重点
  语音变化（弱读、连读、吞音、缩读）、约 80 个高频短语动词、反应语与语气、委婉和暗示、原创短剧理解；约 480 个新词 + 160 个短语。不得复制影视剧台词。

  四、质量要求
  所有对话原创，不复制影视台词或付费教材；不做语法选择题合集；每个知识点都说明「在什么场景用、为什么这样说、中国人容易错在哪」；IPA 准确；不夸大学习效果；联网资源只给能核实的链接，无法核实的要说明。

  五、交付
  先给出第五册 30 天目录（每天的主题、场景、中英差异点、词汇范围），再逐天写完整教材，最后生成 A4 可打印 PDF 和可编辑源文件，并做完整性检查。
