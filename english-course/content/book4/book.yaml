  - 林晓第一次当项目协调人：深圳运营、西雅图工程和美国大客户 BrightNest 三方协作，从启动会、试点、故障、需求变更一直到正式上线
  - 多人会议是主角：每天的听力边听边用英文关键词记笔记；输出在「会议发言 / 口头汇报」和「8–12 句的邮件」之间交替

weeks:
  1: 商务邮件进阶：请求 · 语气 · 确认 · 催促 · 改期 · 介绍
  2: 会议：开场 · 观点 · 同意与反对 · 插话 · 头脑风暴 · 行动项
  3: 问题说明：现象 → 原因 → 影响 → 临时方案 → 长期方案
  4: 方案沟通与项目跟踪：比较 · 建议 · 转述 · 变更 · 进度 · 决策
  5: 综合运用与第四册测评

howto:
  - "第四册是「一个人做事」到「一群人做事」的转变。第三册让你**能把自己的工作说清楚**；第四册要让你**能和别人一起把一件事推下去**：写一封对方愿意马上回的邮件，在会上说出自己的观点、礼貌地反对、把跑题的人拉回来，出了问题能讲清「发生了什么、为什么、影响多大、现在怎么办」，最后拿出方案、推动对方拍板。"
  - "协作英语最难的不是单词，而是**分寸**。中文里「麻烦尽快」「这个不行」「您看着办」都很自然，直译成英文却可能显得催、显得冲、或者显得没主见。第四册每天都从一个中文说法出发，讲清英文里**同一个意思有几种强弱**（Can you… / Could you… / Would it be possible to… / I'd appreciate it if…），什么场合用哪一种。"
  - "语法上，第四册重点处理**礼貌请求的层级**、**观点和同意 / 反对的强弱**、**因果和让步**（stem from / the reason is that / that said）、**条件句**（If we add it now, we'll… / If we had more engineers, we would…）和**转述**（Raj said the codes were ready. / Priya asked whether…）。第三册的薄弱项（被动语态、percent / percentage point、邮件先说目的、拒绝给原因和替代方案、描述问题要具体）在热身和复习日里有计划地复现：**每天热身里第二、三册各有一句**。前三册已注释的 1,931 个词和短语，第四册不再重复注释。"
  - "文本从 **约 240 词**增加到 **约 300 词**，以多人会议、邮件往来和电话转述为主；每天重点学 **20 个词和 5 个短语**；Day 97 / 104 / 111 是阶段复习，Day 120 是第四册测评。听力换成**会议听法**：第一遍不看文字、只用英文关键词记笔记（谁、说了什么、决定了什么、什么时候），第二遍补笔记再答题，然后才看英文。"

split_tip: "上班族可以拆成两段：**早上 60 分钟**（第 1–4 步：热身、中文意图、文本与词汇、语音）＋ **晚上 60 分钟**（第 5–8 步：会议听力、开口、输出、复盘）。特别忙的日子，至少完成**保底 30 分钟**：热身 10 分钟 + 【C】朗读 10 分钟 + 【H】第 3 层 10 分钟，一天都不要断。"

regular_plan:
  - ["旧知识情境复习", 10, "遮住答案，看「热身」里的每句中文，5 秒内用英文说出来（第二、三册各有一句）。说不出的打 ★，翻回原课把那句读 3 遍，再说一次。"]
  - ["中文意图 → 英语表达", 15, "先读【B】，用中文说出这个场景里你要表达的 3 个意思，并想一想「对谁说、该多正式」；再学【E】，每组对比例句大声读 3 遍，完成「小任务」后翻到【答案】核对。"]
  - ["文本与词汇", 25, "【C】第 1 遍只看英文，弄清谁在说话、要解决什么问题；第 2 遍逐句对照中文；第 3 遍配合【D】注释弄懂每个重点词；最后遮住中文，把全文（含邮件）分角色大声读 2 遍。"]
  - ["语音训练", 15, "按【G】：每个重点词拍着重音读 5 遍；每个句子按「/」停顿、「‿」连读读 3 遍，特别注意会议里的句子重音（I **see** your point, **but**…）和语气；录下来和手机朗读版对比，找出 1 处不同。"]
  - ["会议听力", 15, "用手机朗读功能（正常语速）播放【C】，按【G】的「四步听法」：①不看文字听一遍，用英文关键词记笔记 ②再听一遍补笔记，回答【I】前 2 题 ③看英文核对笔记 ④段落听写，再对照原文订正。"]
  - ["开口训练", 20, "【H】三层练习全部出声：第 1 层模仿 3 遍；第 2 层每题至少说 2 个替换版本；第 3 层只看中文情境即兴说，**先说结论，再说理由或细节**，注意对谁说、该多正式，说完再看示范。"]
  - ["输出训练", 12, "完成【H】最后的「今日输出」：单数日做 2 分钟会议发言或口头汇报（录音），双数日写一封 8–12 句的邮件，按日期存档。"]
  - ["当天复盘", 8, "做【I】剩下的检测题并对答案；在「完成清单」打勾；把「明日复习」和「七日后复习」抄进笔记本或手机日历。"]

review_plan:
  - ["旧知识情境复习", 10, "遮住答案，用英文说出「热身」的中文提示。这些句子来自本周不同的日子和前几册，说不出的打 ★。"]
  - ["新情境阅读", 20, "【C】是一个用旧词写成的新情境（一串邮件或一场会议）：先遮住中文读 2 遍，看到虚线词（复现词）就停下来回忆意思和第几天学的，再逐句对照中文。"]
  - ["会议听力", 15, "用手机朗读功能（正常语速）播放【C】：不看文字听一遍、用英文关键词记笔记，再听一遍补笔记，回答【I】的前 2 题；最后看英文核对。"]
  - ["中文意思 → 英文组织", 20, "【H】第 2、3 层：只看中文情境，用本周学过的表达组织英文，先说结论再说理由，注意对谁说、该多正式，先说再写，最后对照示范。"]
  - ["不看原文复述", 15, "合上书，看着自己的笔记，按【H】第 1 层的提示用 10–12 句英文复述【C】：谁提了什么、有什么分歧、最后决定了什么，并录音。"]
  - ["易混表达检查", 15, "做【E】的易混表达检查：每组先自己选、说出理由，再对答案；错的那组把正确例句读 5 遍。"]
  - ["输出与自评", 15, "完成【H】的「今日输出」（录音或写邮件），再做【I】剩下的检测题。"]
  - ["下阶段改善", 10, "读本课最后的「下阶段改善建议」，从薄弱项里选 2 个，写进下周每天的热身时间里。"]

listen_steps:
  - ["① 记笔记盲听", "正常语速，不看任何文字听一遍，只用英文关键词记笔记：谁、说了什么、决定了什么、什么时候。"]
  - ["② 补笔记答题", "再听一遍，把漏掉的数字、日期和人名补上，然后回答【I】的前 2 题。"]
  - ["③ 看英文核对", "打开【C】的英文（不看中文）再听一遍，核对笔记，圈出没听出来的地方；只对仍然不懂的难句看中文。"]
  - ["④ 段落听写", "听写下面指定的句段，再对照原文订正，错的地方读 3 遍。"]

parts:
  - ["A", "今日目标", "今天的场景、要学会的关键表达、词汇范围和**完成标准**——完成标准都写成「能做到什么」，学完自己打勾。"]
  - ["B", "中文场景导入", "先用中文讲清楚：谁和谁沟通、为什么、双方知道什么、你要表达的重点。**先想清楚中文和分寸，再学英文。**"]
  - ["C", "会议 / 邮件 / 对话", "原创的项目场景：多人会议、邮件往来、电话转述，**逐句**配中文。S1、S2 是句子编号，绿色加粗的是今天的重点词。"]
  - ["D", "原文重点词汇注释", "按原文出现顺序注释：原文形式、美式音标、**在这句话里的意思**、使用场景、常用搭配、例句、易错点，并标出它在第几句。"]
  - ["E", "中文怎么想，英文怎么说", "每天 3–4 组中英表达差异：中文想表达什么 → 英文自然说法 → 为什么不同 → 什么时候用 → 对比例句 → 小任务。"]
  - ["F", "今日核心表达", "6–8 个拿来就能用的邮件和会议句型，标明什么时候用、哪些词可以换、正式和随意场合怎么调整。"]
  - ["G", "语音与听力", "重点词的音节和重音；会议里的句子重音、语气和弱读；「记笔记盲听 → 补笔记答题 → 看英文核对 → 段落听写」。"]
  - ["H", "口语实战", "三层练习：**模仿 → 替换 → 只看中文自主表达**（先说结论再说理由），再加 12 分钟的「今日输出」：会议发言 / 口头汇报或 8–12 句的邮件。全部附示范。"]
  - ["I", "理解检测与复盘", "前 2 题是听力题（根据笔记回答），其余是「换个场景还会不会用」的迁移题；附答案、完成清单、明日复习和七日后复习。"]

symbols:
  - "**S3** = 【C】第 3 句；注释里的「位置：S3」= 出现在第 3 句；听写「S5–S7」= 第 5 到第 7 句。"
  - "绿色加粗 + 右上角数字 = 今天的重点词，数字对应【D】里的注释编号。"
  - "橙色虚线 + 右上角 **D75** = 复习日里的复现词，D75 表示它是 Day 75 学的（前三册的词也会标出来）。"
  - "音标一律为**美式**（和欧路、有道词典标「美」的音标一致）。`ˈ` 后面的音节读重音，`ˌ` 是次重音，`ː` 表示长音。"
  - "【G】句子里：**加粗** = 句子重音；/ = 停顿；‿ = 连读。"
  - "✗ = 中式直译或常见错误；✓ = 自然的英文说法。"

audio:
  - "**整篇听**：把【C】的英文复制到手机「朗读」功能（iPhone：设置 → 辅助功能 → 朗读内容；安卓：文字转语音）或有道翻译的朗读按钮，选**美式英语**、**正常语速**。多人会议可以分段复制，每个人换一种声音更容易分清。"
  - "**单词听**：在欧路词典 / 有道词典 / Cambridge Dictionary 网页版查词，点「美」发音。"
  - "**听真人怎么说**：打开 youglish.com，输入短语（加引号），选 US；会议用语（I see your point / Can I just jump in）多听几个不同的人，注意语气。"
  - "**录音对比**：录下自己的发言，和朗读版对比，每次只找 1 处不同（重点听句子重音落在哪个词上）。"
  - "**四步听法**：① 记笔记盲听 ② 补笔记答题 ③ 看英文核对 ④ 段落听写。笔记只用英文关键词，不写中文、不写整句。"

vocab_method:
  - "**首次接触（当天）**：在会议或邮件里读懂 → 看【D】注释 → 在【H】和今日输出里用一次。"
  - "**次日回忆**：第二天的热身会用中文提示考你前一天的句子；每课最后列出「明天热身前再看一遍」的内容。"
  - "**一周复习 + 场景再现**：每课列出「七天后复习」；Day 97 / 104 / 111 / 120 用旧词写新情境；附录 1「复现」一栏是程序逐课检索的真实记录。"

setting: "第四册的故事接着第三册：大卖家 BrightNest 决定把自己的系统和 SwiftLink 全面对接，张涛让林晓当**项目协调人**。9 月初开启动会，9 月 14 日开始试点；林晓要写请求、确认和催促邮件，主持深圳、西雅图和 BrightNest 三方的会议；试点第一周出现订单状态错误，她要讲清原因、影响、临时方案和长期方案；10 月中旬客户临时加需求，她要守住范围、比较方案、推动决策；10 月 28 日赶在 11 月旺季前正式上线，一周后开复盘会。上线一个月后，BrightNest 又提出要扩展到加拿大。"
