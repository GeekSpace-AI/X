outcomes:
  - "按对象调整语气，写请求、确认、催促、改期、介绍的商务邮件（Would it be possible to… / As discussed… / at the latest / Something came up）"
  - "主持一场会议：开场说目的、过议程、控时间、把跑题的话放进 parking lot、收尾分配行动项"
  - "在会上发表观点、礼貌地同意和反对、插话和请对方说清楚（In my view… / I see your point, but… / Can I just jump in?）"
  - "用「现象 → 原因 → 影响 → 临时方案 → 长期方案」口头和书面说明一个问题"
  - "比较两个方案并给出有理由的建议；用条件句说明不同选择的后果（If we choose B, we'll… / If we had…, we would…）"
  - "准确转述别人的话和问题（Raj said the codes were ready. / Priya asked whether…）"
  - "处理需求变更、汇报项目进度、推动对方在期限内做决定"
  - "掌握 {WORDS} 个重点词和 {PHRASES} 个短语的语境用法（逐条见附录 1）"

handoff:
  - title: 已学习的表达模式与中文思维点（第五册不再从零讲解，只在新语境中复现和加深）
    list:
      - "**请求与语气**：Could you… / Would it be possible to… / I'd appreciate it if… / by any chance / if that works for you；Dear / Hi / Hey 的选择（Day 91、92）"
      - "**确认、催促、改期、介绍**：As discussed / To sum up / at the latest / If we don't receive it by…, … / Something came up / bring forward / I'd like to introduce you to…（Day 93–96）"
      - "**会议**：Let's get started / The purpose of today's meeting is… / parking lot / In my view / What's your take on…? / I see your point, but… / Can I just jump in? / What if we…? / I'll take that（Day 98–103）"
      - "**问题说明**：It looks like… / As far as we know… / stem from / The reason is that… / worst-case scenario / for the time being / once and for all / take ownership of / That said（Day 105–110）"
      - "**方案与决策**：whereas / in terms of / I'd recommend… / If we choose…, we'll… / If we had…, we would… / out of scope / in exchange for / on schedule / Can we agree that…? / give the green light（Day 112–117）"
      - "**转述与复盘**：He said (that)… / She asked whether… / point out / In hindsight / If we'd known…（Day 114、118）"
  - title: 已完成的主要情境
    list:
      - "按对象写请求、确认、催促、改期、介绍邮件；处理一个忙乱上午的收件箱"
      - "主持会议、发表和反对观点、插话澄清、头脑风暴、分配行动项；调解一场有分歧的会议"
      - "说明一次系统故障：现象、原因、影响、临时方案、长期方案；给客户副总裁写问题说明邮件；复盘会"
      - "比较方案、给出建议、转述电话内容、处理需求变更、汇报红黄绿进度、推动决策、上线和复盘、讨论新市场"
  - title: 需要在第五册继续复习的薄弱项目（多数学习者在测评中暴露的问题）
    list:
      - "转述时忘记时态后移，或转述问题时仍用疑问语序（✗ She asked could we start on Monday. ✓ She asked whether we could start on Monday.）"
      - "suggest / recommend 后面接 sb to do（✗ I suggest you to wait. ✓ I suggest we wait. / I'd recommend waiting.）"
      - "The reason is because…；if 从句里用 will（✗ If we will add it now…）"
      - "会上只会 I think / I agree / I don't agree，观点没有强弱；反对时直接说 You're wrong."
      - "邮件语气两头偏：对客户高层太随意（Hey Karen），对同事过于客气、句子太长"
      - "第三册的被动语态和第二册的完成时在快速说话时仍会出错"
  - title: 第五册应新学的内容
    list:
