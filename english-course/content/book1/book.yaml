bullets:
  - 连续职场短剧：新人林晓在一家中美合作的跨境物流科技公司里的第一个月
  - 每天 8 步任务、精确到分钟；每课都有答案、示范和复习安排

weeks:
  1: 我是谁 · 我的一天
  2: 过去的事 · 遇到问题
  3: 请求 · 计划 · 联系
  4: 工作中的基础沟通
  5: 综合运用与第一册测评

howto:
  - "这本书适合**学过一点英语、认识一些单词、但一开口就卡住**的成年人。我们不从语法规则开始，而是从你熟悉的中文场景开始：**先把中文想表达的意思想清楚，再学英文自然地怎么说**——哪些中文可以直接对应英文，哪些必须换一种思路重新组织。"
  - "每天学习一个真实场景：第一天上班、早上没吃早饭、上班迟到、电脑登不上、请同事帮忙、向经理说明工作没做完……所有新词都放在**原创短文或对话**里，旁边给出**美式音标、在这句话里的意思、使用场景、常用搭配、例句和中国人的易错点**。你不需要背单词表，只需要读懂、读出声、在练习里用出来。"
  - "第一册的短文从 **80–100 词**开始，到月底增加到 **200 词左右**；每天重点学 **15–20 个词和 3–5 个短语**，每周第 7 天是**阶段复习**，用旧词写成新故事，检查你是不是真的会用。Day 30 是第一册测评，并给出进入第二册的衔接记录。"
  - "评价标准只有一个：**你能不能听懂、能不能说出来、能不能用在自己的生活和工作里**。所以每天的口语练习一定要**出声**，今日输出一定要**录音**——30 天后回头听 Day 1 的录音，你会听到自己的变化。"

split_tip: "上班族可以拆成两段：**早上 60 分钟**（第 1–4 步：热身、中文意图、微故事、语音）＋ **晚上 60 分钟**（第 5–8 步：听力、开口、输出、复盘）。特别忙的日子，至少完成**保底 30 分钟**：热身 10 分钟 + 【C】朗读 10 分钟 + 【H】第 3 层 10 分钟，一天都不要断。"

parts:
  - ["A", "今日目标", "今天的场景、要学会的关键表达、词汇范围和**完成标准**——完成标准都写成「能做到什么」，学完自己打勾。"]
  - ["B", "中文场景导入", "先用中文讲清楚：谁和谁说话、为什么说、双方知道什么、你要表达的重点。**先想清楚中文，再学英文。**"]
  - ["C", "英文微故事 / 对话", "原创短文或对话，**逐句**配中文。S1、S2 是句子编号，绿色加粗的是今天的重点词。"]
  - ["D", "原文重点词汇注释", "按原文出现顺序注释：原文形式、美式音标、**在这句话里的意思**、使用场景、常用搭配、例句、易错点，并标出它在第几句。"]
  - ["E", "中文怎么想，英文怎么说", "每天 2–4 组中英表达差异：中文想表达什么 → 英文自然说法 → 为什么不同 → 什么时候用 → 对比例句 → 小任务。"]
  - ["F", "今日核心表达", "5–8 个拿来就能用的句子或句型，标明什么时候用、哪些词可以换、正式和随意场合怎么调整。"]
  - ["G", "语音与听力", "重点词的音节、重音和口型；句子的重音、停顿、弱读、连读；「四步听法」和听写。"]
  - ["H", "口语实战", "三层练习：**模仿 → 替换 → 只看中文自主表达**，再加一个 12 分钟的「今日输出」录音任务。全部附示范。"]
  - ["I", "理解检测与复盘", "少而精的检测题，重点考「换个场景还会不会用」；附答案、完成清单、明日复习和七日后复习。"]

symbols:
  - "**S3** = 【C】里的第 3 句；词汇注释里的「位置：S3」表示这个词出现在第 3 句。"
  - "绿色加粗 + 右上角数字 = 今天的重点词，数字对应【D】里的注释编号。"
  - "橙色虚线 + 右上角 **D5** = 复习日故事里的复现词，D5 表示它是 Day 5 学的。"
  - "音标一律为**美式**（和欧路、有道词典标「美」的音标一致）。`ˈ` 后面的音节读重音，`ˌ` 是次重音，`ː` 表示长音。"
  - "【G】句子里：**加粗下划线** = 句子重音（读重、读长）；/ = 停顿；‿ = 连读（两个词连成一个音）。"
  - "✗ = 中式直译或常见错误；✓ = 自然的英文说法。"

audio:
  - "**整篇听**：把【C】的英文复制到手机自带的「朗读」功能（iPhone：设置 → 辅助功能 → 朗读内容；安卓：文字转语音），或有道翻译、DeepL 的朗读按钮，选**美式英语**。先 0.8 倍速，再正常速度。"
  - "**单词听**：在欧路词典 / 有道词典 / Cambridge Dictionary 网页版查词，点「美」发音。"
  - "**听真人在真实视频里怎么说某个词**：打开 youglish.com，输入单词，选 US。"
  - "**录音对比**：用手机录音机录下自己的朗读，和朗读版放在一起听，每次只找 1 处不同（通常是重音或连读）。"
  - "**四步听法**：① 看英文听 ② 只看中文听 ③ 什么都不看听 ④ 听写。每一步都比上一步少一点「拐杖」，这就是「逐渐减少中文提示和字幕依赖」。"

vocab_method:
  - "**首次接触（当天）**：在故事里读懂 → 看【D】注释 → 在【H】里用一次。"
  - "**次日回忆**：第二天的热身会用中文提示考你前一天的句子；每课最后列出「明天热身前再看一遍」的内容。"
  - "**一周复习**：每课列出「七天后复习」；Day 7 / 14 / 21 / 30 的复习日用旧词写成新故事。"
  - "**场景再现**：重要的词会在后面的课里换一个场景再出现。附录 1 的「复现」一栏，是程序逐课检索出来的真实复现记录，你可以据此查漏补缺。"

setting: "第一册的故事发生在深圳的 **SwiftLink（迅联科技）**——一家做**跨境物流跟踪系统**的公司：美国的网店卖家用它查询包裹到了哪里。公司在深圳有运营和客服团队，在美国西雅图有工程团队，所以办公室里每天都有中文，也有英文：开会、发消息、视频通话、和系统打交道。主角林晓刚刚入职，她和你一样，英语只有中专基础，认识一些单词，却不太敢开口。30 天里，你会跟着她从第一天报到，一步步学会在这样的环境里用英语生活和工作。"
cast:
  - ["Lily Lin 林晓", "主角 · 24 岁 · 运营助理", "中专毕业，在快递网点做过客服，新入职 SwiftLink 深圳办公室。认真、有点害羞，英语能读一点，不太敢说。"]
  - ["Tom Zhang 张涛", "运营主管 · 林晓的经理", "34 岁，在外企工作多年，英语流利，说话直接但很耐心，常提醒林晓「先说重点」。"]
  - ["Emma Brown", "产品经理 · 美国人", "29 岁，来自西雅图，在深圳工作两年，会说一点中文，爱吃辣，是林晓了解美国文化的窗口。"]
  - ["Grace Wu 吴佳", "客服专员 · 林晓的「入职搭子」", "26 岁，负责回复美国卖家的邮件和消息，英语书面表达很好，经常帮林晓改消息。"]
  - ["Kevin Li 李凯", "IT 支持", "负责电脑、账号和系统权限。话不多，但什么问题都能解决，口头禅是 Have you tried restarting it?"]
  - ["Mike Carter", "西雅图工程经理 · 美国人", "负责系统开发，每周和深圳团队开视频会。语速快、很友好，喜欢聊天气和周末。"]

outcomes:
  - "用 5–8 句英文介绍自己、自己的工作和一天的安排"
  - "分清 **don't / didn't / haven't**，说清楚「习惯」「今天发生的事」和「到现在还没」"
  - "讲述昨天和周末发生的事，说明迟到、问题和没完成工作的原因"
  - "礼貌地提出请求、邀请、拒绝，打一个简单的工作电话，写一条 3–5 句的工作消息"
  - "向经理说明工作进度：在做 / 做完了 / 快好了 / 本来打算……但是……"
  - "听懂慢速对话里的 I'm、didn't、gonna 等常见弱读和缩读"
  - "掌握 {WORDS} 个重点词和 {PHRASES} 个短语的语境用法（逐条见附录 1）"


handoff:
  - title: 已学习的表达模式与中文思维点（第二册不再从零讲解，只在新语境中复现和加深）
    list:
      - "**是 / 很**：形容词前要有 am / is / are（I'm nervous）；**I do / I am / I have** 的区别（Day 1、4）"
      - "**不 / 没 / 还没 / 没有**：don't / didn't / haven't … yet / don't have（Day 2、13）"
      - "**有 / 在**：There is / have；in / on / at 表示地点和时间的基本用法（Day 3、6）"
      - "**了 ≠ 过去式**；一般过去时讲昨天的事；**went / have been**（Day 8、10）"
      - "**can / could / would** 的礼貌层级；**请 ≠ please**（Day 15、19）"
      - "**will / be going to / be -ing** 说计划；**say / tell / speak / talk**（Day 16、17）"
      - "**make / do / take / get / have** 常见搭配；**must / have to / should / don't have to**（Day 24、25）"
      - "**比较级**；**-ed / -ing** 形容心情；**a / an / the** 的基本作用（Day 26–28）"
      - "**I was going to …, but …** 说「本来打算」；进度表达 I'm working on it / I've finished（Day 22–23）"
  - title: 已完成的主要情境
    list:
      - "入职报到、自我介绍、介绍同事和职位、办公室设施"
      - "早晨习惯、通勤、午饭、约时间、周末闲聊、过去的经历"
      - "上班迟到的解释、电脑和系统登录问题、请 IT 帮忙"
      - "礼貌请求、邀请与拒绝、打电话找人、写简短的工作消息"
      - "购买办公用品时的数量与价格、简单比较和选择"
      - "向经理汇报进度、说明没按时完成的原因、规定与建议、和美国同事的第一次视频会"
  - title: 需要在第二册继续复习的薄弱项目（多数学习者在测评中暴露的问题）
    list:
      - "第三人称 -s（She **works** / He **doesn't**）在快速说话时容易漏掉"
      - "过去时动词在口语里忘记变形（I **go** there yesterday）"
      - "回答否定问句时 Yes / No 答反（Day 13、29）"
      - "a / the 的使用仍然不稳定；可数名词复数漏 -s"
      - "听力：快速语流中的 didn't / can't、want to → wanna 仍难分辨"
      - "主动输出时句子太短，缺少 because / so / but 连接"
  - title: 第二册应新学的内容
    list:
      - "**时间表达系统化**：现在完成时（经历、持续 for / since）、过去进行时（I was doing … when …）、used to / be used to"
      - "**连续对话能力**：追问（What happened next? / How come?）、回应（No way! / That makes sense）、讲一个 1–2 分钟的小故事"
      - "**生活场景扩展**：租房、看病、银行、网购退换、交通出行、兴趣爱好、家庭与朋友"
      - "**频率与变化**：getting better / more and more、越来越……、比以前……"
      - "**语音**：句子语调（惊讶、确认、列举）、更多连读与弱读（gonna / wanna / gotta 的主动使用）"
      - "**词汇**：约 500 个新词 + 130 个短语，重点是高频动词短语（look for / find out / pick up / run out of 等）"
  - title: 第二册必须避免的不必要重复
    list:
      - "附录 1 中已注释的 {TOTAL} 个词和短语**不再作为新词完整注释**，只在新语境中复现，并标注首次学习日（如 D5）"
      - "第一册已讲透的中文思维点（是 / 很、不 / 没、了、在、有）不再单独成课，只作为热身和易混检查"
      - "自我介绍、第一天上班、办公室设施等场景不再重复，改为更复杂的版本（如介绍自己的经历和变化）"

continue_prompt: |
  你是一名在中国长期生活、熟悉中美文化的资深英语教育专家和课程设计师。请按照《中文思维桥接英语 · 180 天课程》的既定体系，续写【第二册：Day 31–60 生活交流、时间表达和连续对话】。

  一、必须沿用的体系（与第一册完全一致）
  1. 每天 120 分钟，8 步：旧知识情境复习 10 → 中文意图到英语表达 15 → 微故事与词汇 25 → 语音 15 → 听力 15 → 开口 20 → 输出 12 → 复盘 8（Day 37 / 44 / 51 / 60 为阶段复习日，用复习日的 8 步结构）。每步写明具体操作。
  2. 每课结构 A–I：A 今日目标（情境 / 关键表达 / 词汇范围 / 完成标准）；B 中文场景导入（人物关系、沟通目的、已知信息、表达重点）；C 原创英文微故事或对话，逐句配自然中文，句子编号 S1、S2…；D 按出现顺序的词汇注释（原文形式、原形、词性、美式 IPA、语境语义、使用场景、1–3 个常用搭配、英文例句 + 中文、中国学习者易错点、位置 S#）；E 2–4 组「中文怎么想 → 英文怎么说」（中文意思、自然英文、为什么不同、什么时候用、对比例句、小任务 + 答案）；F 5–8 个核心表达（使用场景、可替换词、正式 / 随意调整）；G 语音与听力（重点词音节重音口型、句子重音停顿弱读连读、书面与口语差异、四步听法、听辨要点、听写句）；H 口语三层（模仿 → 替换 → 只给中文情境的自主表达，附示范）+ 今日输出；I 迁移型检测题 + 答案 + 完成清单 + 明日复习 + 七日后复习。
  3. 每天 15–20 个重点词 + 3–5 个短语，全部自然地出现在当天的故事或对话里；短文从约 180 词逐步增加到约 260 词。
  4. 复习日：用旧词写新情境故事（复现词标注首次学习日）、中文意思组织英文、短对话听力、不看原文复述、易混表达检查、下阶段改善建议。Day 60 提供阶段成果评估、薄弱项目记录和第三册衔接记录。

  二、与第一册的衔接（附件为第一册的 Markdown 源文件，请先读附录 1、2、4）
  1. 附录 1 中已经注释过的词和短语不再作为新词完整注释，只在新语境中复现，并标注首次学习日（如 D5）。
  2. 第一册的薄弱项目（第三人称 -s、过去时变形、否定问句回答、a / the、didn't / can't 听辨、句子太短）要在第二册的热身、练习和复习日中有计划地反复出现。
  3. 继续使用 SwiftLink 的人物（林晓、张涛、Emma、Grace、Kevin、Mike），故事时间推进到林晓入职后的第二个月，场景以生活交流为主、工作为辅。

  三、第二册重点
  现在完成时（经历、for / since）、过去进行时、used to / be used to、追问与回应、讲 1–2 分钟的小故事、句子语调；生活场景：租房、看病、银行、网购退换、交通、兴趣爱好、家庭朋友；约 500 个新词 + 130 个短语。

  四、质量要求
  所有对话原创，不复制影视台词或付费教材；不做语法选择题合集；每个知识点都说明「在什么场景用、为什么这样说、中国人容易错在哪」；IPA 准确；不夸大学习效果；联网资源只给能核实的链接，无法核实的要说明。

  五、交付
  先给出第二册 30 天目录（每天的主题、场景、中英差异点、词汇范围），再逐天写完整教材，最后生成 A4 可打印 PDF 和可编辑源文件，并做完整性检查。
