title: 第一册 · 基础表达与中文思维转换
subtitle: 从「认识单词」到「张口能说」：用中文想清楚，再用英文说出来
title_en: "Book 1 · Day 1–30 · From Chinese Meaning to Everyday English"
series: 中文思维桥接英语 · 180 天课程（共六册）
