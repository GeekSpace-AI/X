number: 2
range: "31–60"
title: 第二册 · 生活交流、时间表达和连续对话
subtitle: 从「会说一句」到「能聊下去」：讲经历、讲变化、讲一件事，并且接得住话
title_en: "Book 2 · Day 31–60 · Talking About Life: Time, Change and Conversation"
series: 中文思维桥接英语 · 180 天课程（共六册）
footer: 中文思维桥接英语 · 第二册 生活交流、时间表达和连续对话（Day 31–60）
pdf_name: 02-第二册-生活交流时间表达和连续对话-Day31-60.pdf
editable_name: 02-第二册-生活交流时间表达和连续对话-可编辑版
bullets:
  - 林晓入职第二个月：搬家、看病、银行、退换货、出行、爱好、家人朋友、送别、通过试用期
  - 每天 8 步任务、精确到分钟；听力改为正常语速，中文提示换成关键词提示

weeks:
  1: 经历与持续：for / since / Have you ever…?
  2: 讲一件过去的事：was doing… when… / 追问与回应
  3: 生活场景：租房 · 搬家 · 看病 · 银行 · 退换货 · 出行
  4: 习惯与变化：used to / be used to / 越来越……
  5: 连续对话与第二册测评

howto:
  - "第二册接着第一册往下走。第一册解决的是「会说一句」：自我介绍、习惯、昨天的事、请求、进度。第二册要解决的是「**能聊下去**」：说清楚一件事**已经持续了多久**、**以前是什么样、现在变成什么样**，**讲一个有头有尾的小故事**，并且在别人说话时**追问、回应、接得住话**。"
  - "中文里「我在深圳住了两年了」「我吃过臭豆腐」「我以前很害羞」「我已经习惯了」「越来越好」这些说法，动词本身都不变，靠「了、过、以前、已经、越来越」表达时间和变化；英文要换成 **have done / have been doing / was doing / used to / be used to / getting better and better**。第二册每天都从这样一句中文出发，讲清楚英文为什么这样说、什么时候用、中国人容易错在哪。"
  - "第一册的薄弱项不会丢下：**每天热身里至少有一句来自第一册**，专门复现第三人称 -s、过去式、否定问句的回答、a / the 和 because / so 连接。第一册已经注释过的 573 个词和短语，第二册不再重复注释，只在新故事里自然出现。"
  - "短文从 **约 180 词**增加到 **约 250 词**；每天重点学 **约 20 个词和 5 个短语**；Day 37 / 44 / 51 是阶段复习，Day 60 是第二册测评。听力改为**正常语速**，「只看中文听」换成「**只看关键词听**」，听写从单句变成**一小段**——拐杖又少了一根。"

split_tip: "上班族可以拆成两段：**早上 60 分钟**（第 1–4 步：热身、中文意图、微故事、语音）＋ **晚上 60 分钟**（第 5–8 步：听力、开口、输出、复盘）。特别忙的日子，至少完成**保底 30 分钟**：热身 10 分钟 + 【C】朗读 10 分钟 + 【H】第 3 层 10 分钟，一天都不要断。"

regular_plan:
  - ["旧知识情境复习", 10, "遮住答案，看「热身」里的每句中文，5 秒内用英文说出来（至少一句来自第一册）。说不出的打 ★，翻回原课把那句读 3 遍，再说一次。"]
  - ["中文意图 → 英语表达", 15, "先读【B】，用中文说出这个场景里你要表达的 3 个意思；再学【E】，每组对比例句大声读 3 遍，完成「小任务」后翻到【答案】核对。"]
  - ["微故事与词汇", 25, "【C】第 1 遍只看英文猜意思；第 2 遍逐句对照中文；第 3 遍配合【D】注释弄懂每个重点词；最后遮住中文，把全文大声读 2 遍。"]
  - ["语音训练", 15, "按【G】：每个重点词拍着重音读 5 遍；每个句子按「/」停顿、「‿」连读读 3 遍，特别模仿弱读和缩读；录下来和手机朗读版对比，找出 1 处不同。"]
  - ["听力训练", 15, "用手机朗读功能（正常语速）播放【C】，按【G】的「四步听法」：①关键词听 ②不看文字听 ③看英文听 ④段落听写，再对照原文订正。"]
  - ["开口训练", 20, "【H】三层练习全部出声：第 1 层模仿 3 遍；第 2 层每题至少说 2 个替换版本；第 3 层只看中文情境即兴说，**每个回答至少两句**（回答 + 细节或反问），说完再看示范。"]
  - ["输出训练", 12, "完成【H】最后的「今日输出」：录一段 1.5 分钟语音，或写 8–10 句话，按日期存档。"]
  - ["当天复盘", 8, "做【I】检测题并对答案；在「完成清单」打勾；把「明日复习」和「七日后复习」抄进笔记本或手机日历。"]

review_plan:
  - ["旧知识情境复习", 10, "遮住答案，用英文说出「热身」的中文提示。这些句子来自本周不同的日子和第一册，说不出的打 ★。"]
  - ["新情境阅读", 20, "【C】是一个用旧词写成的新故事：先遮住中文读 2 遍，看到虚线词（复现词）就停下来回忆意思和第几天学的，再逐句对照中文。"]
  - ["听懂短对话", 15, "用手机朗读功能（正常语速）播放【C】的对话部分：先不看文字听 2 遍，回答【I】的前 2 题；再看英文听一遍核对。"]
  - ["中文意思 → 英文组织", 20, "【H】第 2、3 层：只看中文情境，用本周学过的表达组织英文，每题至少说两句，先说再写，最后对照示范。"]
  - ["不看原文复述", 15, "合上书，按【H】第 1 层的提示用 8–10 句英文复述【C】的故事，并录音。"]
  - ["易混表达检查", 15, "做【E】的易混表达检查：每组先自己选、说出理由，再对答案；错的那组把正确例句读 5 遍。"]
  - ["输出与自评", 15, "完成【H】的「今日输出」录音，再做【I】剩下的检测题。"]
  - ["下阶段改善", 10, "读本课最后的「下阶段改善建议」，从薄弱项里选 2 个，写进下周每天的热身时间里。"]

listen_steps:
  - ["① 关键词听", "正常语速，只看【B】的「表达重点」和【D】的词头，听出谁、在哪、发生了什么。"]
  - ["② 不看文字听", "合上书再听一遍，每段听完在心里用一句话说出大意。"]
  - ["③ 看英文听", "打开【C】的英文（不看中文），把没听出来的词圈出来——多半是弱读、连读或缩读。"]
  - ["④ 段落听写", "听写下面指定的句段，再对照原文订正，错的地方读 3 遍。"]

parts:
  - ["A", "今日目标", "今天的场景、要学会的关键表达、词汇范围和**完成标准**——完成标准都写成「能做到什么」，学完自己打勾。"]
  - ["B", "中文场景导入", "先用中文讲清楚：谁和谁说话、为什么说、双方知道什么、你要表达的重点。**先想清楚中文，再学英文。**"]
  - ["C", "英文微故事 / 对话", "原创短文或对话，**逐句**配中文。S1、S2 是句子编号，绿色加粗的是今天的重点词。"]
  - ["D", "原文重点词汇注释", "按原文出现顺序注释：原文形式、美式音标、**在这句话里的意思**、使用场景、常用搭配、例句、易错点，并标出它在第几句。"]
  - ["E", "中文怎么想，英文怎么说", "每天 3–4 组中英表达差异：中文想表达什么 → 英文自然说法 → 为什么不同 → 什么时候用 → 对比例句 → 小任务。"]
  - ["F", "今日核心表达", "5–8 个拿来就能用的句子或句型，标明什么时候用、哪些词可以换、正式和随意场合怎么调整。"]
  - ["G", "语音与听力", "重点词的音节和重音；句子的重音、停顿、弱读、连读和缩读；正常语速的「四步听法」和段落听写。"]
  - ["H", "口语实战", "三层练习：**模仿 → 替换 → 只看中文自主表达**（每个回答至少两句），再加一个 12 分钟的「今日输出」录音任务。全部附示范。"]
  - ["I", "理解检测与复盘", "少而精的检测题，重点考「换个场景还会不会用」；附答案、完成清单、明日复习和七日后复习。"]

symbols:
  - "**S3** = 【C】里的第 3 句；词汇注释里的「位置：S3」表示这个词出现在第 3 句；听写「S5–S7」表示第 5 到第 7 句。"
  - "绿色加粗 + 右上角数字 = 今天的重点词，数字对应【D】里的注释编号。"
  - "橙色虚线 + 右上角 **D12** = 复习日故事里的复现词，D12 表示它是 Day 12 学的（第一册的词也会标出来）。"
  - "音标一律为**美式**（和欧路、有道词典标「美」的音标一致）。`ˈ` 后面的音节读重音，`ˌ` 是次重音，`ː` 表示长音。"
  - "【G】句子里：**加粗** = 句子重音（读重、读长）；/ = 停顿；‿ = 连读（两个词连成一个音）。"
  - "✗ = 中式直译或常见错误；✓ = 自然的英文说法。"

audio:
  - "**整篇听**：把【C】的英文复制到手机自带的「朗读」功能（iPhone：设置 → 辅助功能 → 朗读内容；安卓：文字转语音），或有道翻译、DeepL 的朗读按钮，选**美式英语**。第二册直接用**正常语速**；实在跟不上，再退回 0.8 倍速听一遍。"
  - "**单词听**：在欧路词典 / 有道词典 / Cambridge Dictionary 网页版查词，点「美」发音。"
  - "**听真人怎么说**：打开 youglish.com，输入单词或短语（短语加引号），选 US。"
  - "**录音对比**：录下自己的朗读，和朗读版对比，每次只找 1 处不同（重点听 have / has / been / was 的弱读）。"
  - "**四步听法**：① 关键词听 ② 不看文字听 ③ 看英文听 ④ 段落听写。「只看中文」换成了「只看关键词」，听写从一句变成一段。"

vocab_method:
  - "**首次接触（当天）**：在故事里读懂 → 看【D】注释 → 在【H】里用一次。"
  - "**次日回忆**：第二天的热身会用中文提示考你前一天的句子；每课最后列出「明天热身前再看一遍」的内容。"
  - "**一周复习**：每课列出「七天后复习」；Day 37 / 44 / 51 / 60 的复习日用旧词写成新故事。"
  - "**场景再现**：新词会在后面的课里换场景再出现；第一册的词大量复现但不再注释。附录 1「复现」一栏是程序逐课检索的真实记录。"

setting: "第二册的故事接着第一册：林晓在深圳 **SwiftLink（迅联科技）** 入职已经一个多月，工作慢慢上了手，生活却有一堆新事要处理——要不要搬家、怎么跟中介和房东谈、感冒了去诊所怎么说、去银行开户和汇款、网购的衣服不合身要退换、带刚来的实习生坐公交。她还要在聊天里讲清楚「我在这儿多久了」「我以前是什么样」「这件事是怎么发生的」，并且接得住同事的话。月底，大学同学小梅要去上海工作，林晓也迎来了试用期的最后一次谈话。"
