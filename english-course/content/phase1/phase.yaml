title: 第一阶段 · 开口期
subtitle: 把「认识的词」变成「说得出口的话」
title_en: "Phase 1 · Day 1–30 · Start Speaking"
range: "1–30"
bullets:
  - 30 天 · 每天 2 小时 · 780 个词汇卡 + 240 个「拿来就用」的句块
  - 一部连载职场短剧：新人 Lily 从入职到飞去芝加哥见客户
  - 每天一个「中文思维 → 英文表达」对照点（不/没、了、在、会、要……）
  - 每天都有口语练习 + 词汇理解题 + 参考答案
weeks:
  1: 入职第一周
  2: 和客户打交道
  3: 从报价到订单
  4: 出差美国
  5: 阶段复习与测试
howto:
  - "这本书不是让你背单词表、刷语法题的。每天的核心是一集**职场短剧**：主角 Lily 和你一样，英语只有中专基础、认识一些简单词但开不了口。她进了一家做小家电出口的深圳公司，从第一天上班、接电话、写邮件、报价、谈价格、下单，一直到飞去芝加哥见美国客户。你跟着她一集一集往下走，常用词就在故事里反复出现。"
  - "每个新词都**紧跟在段落下面**给出：美式发音（音标）、中文意思、以及最重要的——**它在什么场景下用、跟谁搭配**。你不需要背，只需要读懂、读出声、在练习里用一次。第二天热身会再用一次，复习日再用一次。用过三次的词，自然就是你的了。"
  - "每天还有一个**「中文思维 → 英文表达」**小节。我在中国教了很多年英语，发现中国学生最大的问题不是单词量，而是用中文的逻辑直接套英文：「我很忙」说成 I very busy，「我没吃早饭」和「我不吃早饭」分不清。所以我们反过来：**从你熟悉的中文说法出发**，看英文对应怎么说、为什么这么说。不讲语法术语，只讲「这个意思英文怎么说」。"
  - "口语和词汇同时练：每天的对话标了**重音和连读**，跟读模仿；口语练习有「中译英张口说」「情景应答」「1 分钟自述」三种；词汇题全部放在**句子和场景里**做，不考拼写、不考词性。"
routine:
  - ["① 热身复习", "10 分钟", "用英文说出 4–6 句前一天的中文提示，说不出来就翻回前一天。**这是最重要的 10 分钟**——学过的东西第二天再用一次，记忆才会扎根。"]
  - ["② 短剧精读", "35 分钟", "每段：①先只看英文猜意思 ②看中文核对 ③看段落下方词表的「使用场景」 ④整段大声朗读 2 遍。词不用背，读懂 + 读出声就够。"]
  - ["③ 中文思维", "15 分钟", "把表格里每一行的英文**大声说 3 遍**，特别注意「✗ 中式直译」那一列——那是你最容易说错的地方。"]
  - ["④ 对话 + 发音", "25 分钟", "先看发音小课练 5 分钟，再跟读对话：一句一句听 → 模仿重音和连读 → 录音对比。最后分角色自己演一遍。"]
  - ["⑤ 口语练习", "20 分钟", "B、C 部分**一定要出声说**，说完再看答案；D 部分录一段 1 分钟音频，存在手机里，30 天后回来听，你会吓一跳。"]
  - ["⑥ 词汇理解", "15 分钟", "做完对答案。错了的题，把正确的句子大声读 3 遍，抄到小本子上。"]
audio:
  - "**单词发音**：在「欧路词典」「有道词典」或剑桥词典网页版查词，选择「美式 / US」发音，跟读 3 遍。"
  - "**整句 / 对话**：把 PDF 里的英文复制到有道翻译、DeepL 或手机自带朗读（iPhone：设置 → 辅助功能 → 朗读内容；安卓：「文字转语音」），选美式英语，调到 0.8 倍速跟读。"
  - "**想听真人在真实场景里怎么说某个词**：打开 youglish.com，输入单词，选 US，它会从 YouTube 视频里找出美国人说这个词的片段——这是最好的「使用场景」老师。"
  - "**录音对比**：用手机录音机录自己读的版本，和朗读版放在一起听，找出不一样的地方（通常是重音和连读）。"
cast_intro: "本阶段的短剧是一部连续剧：30 集讲的是 Lily 入职头五个月里的 30 个片段——从第一天上班，到拿下第一单，再到飞去芝加哥见客户。人物不多，每个人都有自己说话的风格，你会慢慢熟悉他们。"
cast:
  - ["Lily Lin 林晓", "主角 · 24 岁 · 新来的销售助理", "中专毕业，在商场卖过家电，英语只认识简单词、不敢开口。入职深圳 BrightWay Home 当销售助理。**她就是你。**"]
  - ["David Zhang 张伟", "销售经理 · Lily 的上司", "35 岁，做外贸 10 年，英语流利，说话幽默，爱用短句。他是 Lily 的师傅，经常教她「老外真正怎么说」。"]
  - ["Emma Brown", "市场经理 · 美国人", "来自美国俄亥俄州，在中国生活了 6 年，会说一点中文。热心、爱吃辣，是 Lily 了解美国文化的窗口。"]
  - ["Kevin Li 李凯", "IT 兼行政", "负责电脑、账号、门禁卡这些事。话不多，但什么都会修。"]
  - ["Amy Chen 陈静", "财务", "管报价审核、收款、发票。做事一丝不苟，口头禅是 Let me double-check."]
  - ["Sarah Johnson", "美国客户 · 采购经理", "芝加哥家居连锁零售商 HomeStar 的采购经理。专业、直接、守时，是 Lily 的第一个大客户。"]
outcomes:
  - "用 1 分钟流畅地介绍自己、自己的公司和产品"
  - "接听英文电话、帮人留言、说清楚数字和拼写"
  - "看懂并写出 5 句左右的简单商务邮件（询价、报价、确认订单）"
  - "听懂并说出报价、样品、交期、付款的核心表达"
  - "出国出差能独立订酒店、过海关、打车、点餐、和客户寒暄"
  - "分清「不/没/了/过/在/会/要/给/被/的」等 28 个中文习惯在英文里的说法"
