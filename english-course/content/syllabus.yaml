ipa_marks:
  - "`ˈ` 主重音：符号后面的音节读得最重、最长、最高。例：manager `/ˈmænɪdʒər/`"
  - "`ˌ` 次重音：读得比主重音轻，但比其他音节重。例：introduce `/ˌɪntrəˈduːs/`"
  - "`ː` 长音：前面的元音要拉长。例：team `/tiːm/`"
  - "本书对话中：**加粗下划线** = 句子重音；‿ = 连读（两个词连成一个音）。"

