title: 中文思维桥接英语
subtitle: 180 天课程总纲 · 先想清楚中文，再说出自然的英文
title_en: "Bridging from Chinese · A 180-Day English Course for Adult Learners"
pdf_name: 00-课程总纲-180天路线图.pdf
footer: 中文思维桥接英语 · 180 天课程总纲
bullets:
  - 6 册 · 180 天 · 每天 120 分钟，分 8 步完成
  - 目标约 3,000 个高频词族 + 约 800 个常用短语与搭配
  - 词在原创故事里学，语法藏在中文场景里讲
  - 生活 · 职场 · 商务协作 · 自然口语 · 短剧理解，逐册递进

letter:
  - "你好！"
  - "我在中国教英语很多年，学生里有大学生、外贸业务员、客服、程序员，也有只上过中专、却每天要和外国同事打交道的人。他们最常对我说的一句话是：「单词我都认识，可一张嘴就卡住。」"
  - "卡住的原因，往往不是词汇量，而是**脑子里的中文和嘴里的英文之间缺了一座桥**。中文说「我没吃早饭」，英文要用 didn't；中文说「请帮我看一下」，英文更自然的是 Could you take a look?；中文说「你不饿吗？——不饿」，英文却要答 No, I'm not. 这些差别，背单词表和刷语法题都教不会。"
  - "所以这套课程的每一课，都**先用中文把场景讲清楚**：谁和谁说话、为什么说、你想表达什么；**再学英文怎么自然地说**——哪些可以直接对应，哪些必须换一种思路。语法不讲术语，只回答三个问题：什么时候用？为什么这样说？中国人容易错在哪？"
  - "新词全部放在原创的小故事和对话里：一家中美合作的物流科技公司里，新人林晓从第一天上班开始，学着发消息、开会、解释问题、和美国同事视频……每个词旁边都写着美式音标、在这句话里的意思、使用场景、常用搭配和易错点。读懂故事、读出声、在练习里用出来，词就慢慢变成你的。"
  - "我也要诚实地告诉你：180 天不会把任何人变成母语者。但如果你每天认真完成 120 分钟、**大声说、录下来**，你会达到一个清楚可测的水平：日常和工作中的常见话题能听懂、能开口、能写清楚，看简单的英文短剧能跟上大意。每一册结束都有测评，你能亲耳听到自己的进步。"
  - "我们开始吧。Let's get started!"
letter_sign: "—— 你的英语老师"

audience:
  - ["适合谁", "有初中或中专英语基础的成年人：认识一些简单词，读得懂一点，但不太敢开口、听不太懂正常语速；需要在生活或工作中（外贸、跨境电商、物流、IT、客服、办公室）用英语。"]
  - ["每天投入", "120 分钟，分 8 步完成；上班族可以拆成早晚两段。每 7 天一个复习日，每 30 天一次阶段测评。"]
  - ["不适合谁", "只想在短期内应付考试刷分的学习者；已经能流利进行商务谈判的高级学习者（可以直接从第五、六册挑选内容）。"]
  - ["关于效果", "课程不承诺 180 天达到母语者水平。我们给出的是**可测量的阶段目标**：每册结束时你能完成哪些任务，用测评和录音来检验。"]

final_goals:
  - "掌握约 **3,000 个高频词族**和约 **800 个常用短语与搭配**——不是认识，而是能在对应场景里听懂、多数能说出来"
  - "日常生活和工作中能用英语完成**汇报、会议发言、写邮件、跟进进度、和客户沟通、说明问题、提出方案**"
  - "听懂常见的**弱读、连读、重音变化和缩读**（gonna / wanna / didn't / I'd），在 0.8–1.0 倍语速下理解日常和职场对话"
  - "看懂常见题材的**英文短剧**（职场、家庭、朋友场景），理解语气、反应和简单的言外之意"
  - "完成一次 **5 分钟英文录音**：讲述自己的工作、一个经历和一个解决问题的过程"

principles:
  - ["先中文意图，后英文表达", "每课先用中文讲清场景：人物关系、沟通目的、已知信息、表达重点。想清楚「要说什么」，再学「英文怎么说」。"]
  - ["不逐字翻译", "哪些中文能直接对应英文、哪些必须换思路，每天 2–4 组对照讲透：「不 / 没」「了」「请」「有 / 在」「吧 / 呢」……"]
  - ["语法藏在语境里", "不讲术语、不刷题。每个知识点只回答：什么时候用、为什么这样说、中国人容易错在哪；学完就能在当天的场景里用。"]
  - ["词在故事里，不在单词表里", "每天 15–20 个重点词 + 3–5 个短语，全部来自当天的原创短文或对话，旁边就是音标、语境意思、场景、搭配、例句和易错点。"]
  - ["间隔复现，不靠死记", "首次接触 → 次日热身 → 七天后复习 → 新场景再现。每册附录有逐词的「复现记录」，标出新学、复现、已能识别、尚待主动运用。"]
  - ["听说并重，逐步拿掉拐杖", "四步听法（看英文听 → 只看中文听 → 不看听 → 听写），一册比一册少中文提示；开口分三层：模仿 → 替换 → 只看中文自主表达。"]
  - ["发音讲到句子", "不只是单词音标，还有句子重音、停顿、弱读、连读、缩读，以及「书面写法」和「口语实际读法」的区别。"]
  - ["每天都有输出", "每天 12 分钟输出任务：1 分钟录音或 5–8 句书面表达，附示范。录音按日期存档，就是你的进步记录。"]

lesson_parts:
  - ["A", "今日目标", "场景、关键表达、词汇范围、完成标准（写成「能做到什么」）"]
  - ["B", "中文场景导入", "人物关系、沟通目的、已知信息、表达重点"]
  - ["C", "英文微故事 / 对话", "原创，逐句配自然中文，句子编号 S1、S2……"]
  - ["D", "重点词汇注释", "按出现顺序：原文形式、美式 IPA、语境意思、场景、搭配、例句、易错点、位置"]
  - ["E", "中文怎么想，英文怎么说", "2–4 组：中文意思 → 自然英文 → 为什么不同 → 何时用 → 对比 → 小任务"]
  - ["F", "今日核心表达", "5–8 个句型：何时用、可替换词、正式 / 随意"]
  - ["G", "语音与听力", "音节重音、句子重音、停顿、弱读、连读、四步听法、听写"]
  - ["H", "口语实战", "模仿 → 替换 → 中文情境自主表达 + 今日输出，全部附示范"]
  - ["I", "检测与复盘", "迁移型检测题 + 答案、完成清单、明日复习、七日后复习"]

split_tip: "上班族可以拆成两段：**早上 60 分钟**（第 1–4 步）＋ **晚上 60 分钟**（第 5–8 步）。特别忙的日子做「30 分钟保底版」：热身 10 分钟 + 故事朗读 10 分钟 + 开口第 3 层 10 分钟——一天都不断，比周末突击 6 小时有效得多。"

before_start:
  - "**录一段「Day 0」音频**：用英文做 1 分钟自我介绍，说多少算多少，哪怕只有三句。存好，Day 30、90、180 各听一次。"
  - "**准备工具**：词典 App（欧路或有道，发音选「美」）、手机录音机、手机朗读功能（把课文读给你听）、一个笔记本。"
  - "**固定时间**：每天两个固定时间段（如早上 7:00–8:00、晚上 9:00–10:00），写进手机日历。"
  - "**找一个监督人**：每周把打卡表拍照发给家人或朋友。"

books:
  - name: 第一册
    days: "Day 1–30"
    title: 基础表达与中文思维转换
    status: 已完成（本次交付）
    story: 林晓入职深圳 SwiftLink（跨境物流跟踪系统）的第一个月：报到、认识同事、迟到、登不上系统、请人帮忙、打电话、发消息、汇报进度、第一次和西雅图视频会。
    words: "{B1}"
    text: 短文 80 → 200 词
    listening: 手机朗读 0.8 倍速；四步听法全程有英文和中文可对照
    weeks:
      - "第 1 周 · 我是谁、我的一天（自我介绍、习惯与不 / 没、办公室、职位、午饭、时间）"
      - "第 2 周 · 过去的事、遇到问题（昨天做了什么、迟到、去过吗、周末、电脑登不上、问与答）"
      - "第 3 周 · 请求、计划、联系（帮忙、下周安排、打电话、邀请与拒绝、工作消息、网购办公用品）"
      - "第 4 周 · 工作中的基础沟通（进度、没按时完成、规定与建议、make / do / take / get / have、比较、心情、包裹查询）"
      - "第 5 周 · 第一次视频会 + 第一册测评"
    goals:
      - "用 5–8 句英文介绍自己、自己的工作和一天的安排"
      - "分清 don't / didn't / haven't / don't have，说清习惯、某次没做、到现在还没"
      - "礼貌地请求、邀请、拒绝；接一个简单的工作电话并留言；写 3–5 句的工作消息"
      - "说明工作进度和延误原因：在做 / 做完了 / 快好了 / 本来打算……但是……"
      - "测评：1 分钟录音 + 新情境阅读 + 短对话听力 + 中文情境英文表达"
  - name: 第二册
    days: "Day 31–60"
    title: 生活交流、时间表达和连续对话
    status: 规划中（衔接记录和续写指令见第一册附录 4、5）
    story: 林晓入职第二个月：租房搬家、看病、银行、网购退换、和同事周末出游；在对话中学会追问、回应和讲一个完整的小故事。
    words: 约 520 词 + 130 短语
    text: 短文 180 → 260 词
    listening: 正常语速朗读；中文提示改为关键词提示；开始听写整段
    weeks:
      - "第 1 周 · 经历与持续：I've been… / for / since / How long…?"
      - "第 2 周 · 讲一件过去的事：I was doing… when…、先后顺序、故事的开头和结尾"
      - "第 3 周 · 生活场景：租房、看病、银行、网购退换、交通出行"
      - "第 4 周 · 习惯与变化：used to / be used to / get used to、越来越……、比以前……"
      - "第 5 周 · 连续对话综合 + 第二册测评"
    goals:
      - "讲一个 1–2 分钟的个人经历，有时间、顺序和感受"
      - "用现在完成时说经历和持续时间；分清 used to 和 be used to"
      - "在租房、看病、银行、退换货等场景中完成一次完整对话"
      - "连续对话 6–8 个来回：追问（What happened next? / How come?）和回应（No way! / That makes sense.）"
      - "测评：2 分钟录音 + 正常语速短对话听力"
  - name: 第三册
    days: "Day 61–90"
    title: 工作场景与基础商务沟通
    status: 规划中
    story: 林晓转正，开始独立负责一组美国卖家：介绍流程、用数据汇报、回复客户、描述系统报错、跟踪物流状态。
    words: 约 520 词 + 140 短语
    text: 短文 200 → 280 词；邮件与聊天记录
    listening: 先不看文字听 2 遍再答题；只对难句给中文
    weeks:
      - "第 1 周 · 职责与流程：be responsible for、first / then / after that、被动语态入门（The order is shipped.）"
      - "第 2 周 · 汇报与数据：数字、百分比、趋势（increase by / to）、简单图表"
      - "第 3 周 · 客户沟通：回复咨询、解释规则、道歉与补救、礼貌地说「不」"
      - "第 4 周 · 系统与物流：账号权限、报错描述、API / 系统对接的基础词汇、物流状态与异常"
      - "第 5 周 · 综合 + 第三册测评"
    goals:
      - "用英文介绍岗位职责和一个工作流程（5–8 步）"
      - "用数字和百分比做 1 分钟的周数据汇报"
      - "回复客户咨询：确认问题、解释原因、给出补救方案"
      - "清楚描述一个系统问题：什么时候、做了什么、看到什么报错、影响谁"
      - "测评：写一封 6–10 句的工作邮件 + 2 分钟口头汇报"
  - name: 第四册
    days: "Day 91–120"
    title: 商务协作、邮件、会议、问题说明和方案沟通
    status: 规划中
    story: 林晓参与一个跨部门项目：深圳运营、西雅图工程和美国客户三方协作，项目延期、系统故障、需求变更，她要写邮件、开会、提方案。
    words: 约 520 词 + 140 短语
    text: 邮件、会议记录、对话 220 → 300 词
    listening: 会议式多人对话；只给英文关键词；边听边记笔记
    weeks:
      - "第 1 周 · 商务邮件：请求、跟进、催促、确认、改期（I was wondering if… / Just following up on…）"
      - "第 2 周 · 会议：开场、发言、同意与反对、打断与澄清、总结行动项"
      - "第 3 周 · 问题说明：现象 → 原因 → 影响 → 临时方案 → 长期方案"
      - "第 4 周 · 方案沟通与项目跟踪：比较选项、给出建议、推动决策、转述他人的话"
      - "第 5 周 · 综合 + 第四册测评"
    goals:
      - "写结构完整的商务邮件：请求、跟进、确认、催促、改期"
      - "在会议中发表观点、礼貌地同意和反对、总结行动项"
      - "用「现象—原因—影响—方案」说明一个问题（系统故障、物流延误、需求变更）"
      - "比较两个方案并给出建议，推动对方做决定"
      - "测评：模拟一次 10 分钟项目会议 + 一封问题说明邮件"
  - name: 第五册
    days: "Day 121–150"
    title: 自然口语、短语、语音变化、情境故事和短剧理解
    status: 规划中
    story: 原创情景短剧：办公室、合租公寓、朋友聚会、旅行中的小插曲；角色说话更快、更口语，带情绪和潜台词。
    words: 约 480 词 + 160 短语（重点是短语动词）
    text: 短剧场景 250 → 300 词
    listening: 第一遍无字幕，第二遍英文字幕；关注语气、反应和言外之意
    weeks:
      - "第 1 周 · 语音变化：弱读、连读、吞音、缩读（gonna / wanna / gotta / kinda / lemme）"
      - "第 2 周 · 高频短语动词：pick up、figure out、run into、come up with、put off……"
      - "第 3 周 · 反应语与语气：No way! / Seriously? / I'm in. / Fair enough.，委婉和暗示"
      - "第 4 周 · 原创短剧：职场、家庭、朋友场景，听懂幽默和潜台词"
      - "第 5 周 · 综合 + 第五册测评"
    goals:
      - "听懂含弱读、连读、缩读的自然语速对话"
      - "理解并使用约 80 个高频短语动词"
      - "用自然的反应语接话，听出说话人的态度和言外之意"
      - "看原创短剧时，第一遍无字幕能说出主要情节"
      - "测评：短剧无字幕理解 + 3 分钟情景对话录音"
  - name: 第六册
    days: "Day 151–180"
    title: 综合听说、复杂情境、灵活表达与真实应用
    status: 规划中
    story: 林晓带着团队处理一个重要客户：投诉升级、谈判续约、做产品演示，最后出差西雅图拜访客户和同事。
    words: 约 500 词 + 120 短语
    text: 综合材料 280 → 350 词
    listening: 接近真实语速；可配合 VOA Learning English、BBC Learning English 等公开材料
    weeks:
      - "第 1 周 · 复杂情境：投诉升级、冲突处理、传达坏消息"
      - "第 2 周 · 谈判与说服：条件（If you…, we could…）、让步、坚持底线"
      - "第 3 周 · 演示与汇报：3–5 分钟陈述、图表讲解、回答提问"
      - "第 4 周 · 真实应用：出差美国（机场、酒店、拜访）、商务饭局、自我推介"
      - "第 5 周 · 180 天总复习与毕业测评"
    goals:
      - "在投诉、冲突、坏消息等复杂情境中保持礼貌而清楚"
      - "进行一次简单的谈判：提出条件、让步、达成一致"
      - "做 3–5 分钟的英文演示并回答提问"
      - "独立完成出差和商务社交的全流程"
      - "毕业测评：5 分钟录音（工作 + 经历 + 解决问题的过程）"

points:
  - ["I do / I am / I have（做 / 是 / 有）", "第一册 Day 1、4", "第二册起在新场景中复现"]
  - ["不 / 没 / 还没 / 没有：don't / didn't / haven't … yet / don't have", "第一册 Day 2、13", "第二册：现在完成时"]
  - ["I went / I've been / I was going to", "第一册 Day 8、10、23", "第二册 Day 31–36（现在完成时）、Day 38–39（过去进行时）"]
  - ["can / could / would 的礼貌层级；请 ≠ please", "第一册 Day 5、15、18", "第三册客户沟通、第四册邮件"]
  - ["say / tell / speak / talk", "第一册 Day 17", "第四册转述他人的话"]
  - ["make / do / take / get / have", "第一册 Day 25", "第五册短语动词"]
  - ["in / on / at（地点和时间）", "第一册 Day 3、6", "第二册 Day 31、36 时间表达（for / since / ago）"]
  - ["a / an / the", "第一册 Day 28", "第三册产品、系统和流程描述"]
  - ["must / have to / should / don't have to", "第一册 Day 24", "第四册规定、建议和义务"]
  - ["used to / be used to / get used to", "第二册 Day 52、53", "第五、六册复现"]
  - ["否定、疑问和自然回答（含否定问句）", "第一册 Day 2、13、29", "第二册 Day 40–42、59 追问与回应"]
  - ["礼貌和委婉表达", "第一册 Day 5、15、18、19", "第四册 I was wondering if…；第六册谈判"]
  - ["被动语态（东西做主语）", "第一册 Day 28 初见", "第三册第 1 周系统讲"]
  - ["条件句（If…, we could…）", "第三册初见", "第四册方案、第六册谈判"]

differences:
  - ["英文句子必须有主语和动词", "我很忙 → I'm busy；好冷 → It's cold；有个问题 → There's a problem。", "第一册 Day 1、3"]
  - ["时间靠动词变化，不靠「了、过、没」", "不 → don't；没 → didn't；还没 → haven't … yet；去过 → have been；住了两年了 → have lived … for two years。「了」不等于过去式。", "第一册 Day 2、8、10；第二册 Day 31–34"]
  - ["「有」分两种", "我有一张桌子 → I have a desk；五楼有两间会议室 → There are two meeting rooms on the fifth floor。", "第一册 Day 3"]
  - ["名词分可数和不可数，没有量词", "两箱纸 → two boxes of paper；一些建议 → some advice（不加 s）；三万 → thirty thousand。", "第一册 Day 20"]
  - ["礼貌靠问句，不靠「请」", "请帮我看一下 → Could you take a look? 「请 + 命令」仍然是命令。", "第一册 Day 15"]
  - ["连接词不成对出现", "因为……所以…… → because 和 so 二选一。", "第一册 Day 9"]
  - ["回答问题只看事实", "你不饿吗？——不饿 → No, I'm not。你不用新看板，对吧？——对，不用 → No, I don't。", "第一册 Day 13、29"]
  - ["东西做主语时常用被动", "包裹送到了 → The package was delivered。中文常省略「被」。", "第一册 Day 28；第三册"]
  - ["感受用 -ed，事物用 -ing", "我很无聊 → I'm bored；这个会很无聊 → The meeting is boring。", "第一册 Day 27"]
  - ["语气词换成句型或语调", "吧 → Let's… / …, right?；呢 → What about…? / And you?；一下 → take a look。", "第一册 Day 5、11、29"]

