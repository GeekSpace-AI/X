  - ["ð", "this, the, with", "同上，但喉咙振动（浊）——不是 z 或 d"]
  - ["v", "very, video", "上牙咬下唇，振动"]
  - ["w", "work, well", "嘴唇撅圆，不碰牙齿"]
  - ["r", "right, price", "舌尖往后卷，不碰任何地方"]
  - ["l", "light, list", "舌尖顶住上牙龈"]
  - ["ʃ", "ship, shipping", "「嘘」，嘴唇略撅"]
  - ["ʒ", "usually, decision", "「嘘」的浊音"]
  - ["tʃ", "check, chart", "「吃」，嘴唇略撅"]
  - ["dʒ", "job, manager", "「知」，嘴唇略撅"]
  - ["ŋ", "thing, morning", "舌根抬起，鼻音收尾"]
  - ["j", "yes, you, usually", "「耶」的开头"]
ipa_marks:
  - "`ˈ` 主重音：符号后面的音节读得最重、最长、最高。例：manager `/ˈmænɪdʒər/`"
  - "`ˌ` 次重音：读得比主重音轻，但比其他音节重。例：introduce `/ˌɪntrəˈduːs/`"
  - "`ː` 长音：前面的元音要拉长。例：team `/tiːm/`"
  - "本书对话中：**加粗下划线** = 句子重音；‿ = 连读（两个词连成一个音）。"

differences:
  - ["英文句子必须有主语和动词", "我很忙 → I'm busy；好冷 → It's cold；有个问题 → There's a problem。", "Day 1, 8, 25"]
  - ["时间靠动词变化，不靠「了、过、没」", "不 → don't；没 → didn't；还没 → haven't…yet；过 → have been。「了」不等于过去式。", "Day 2, 4, 7"]
  - ["先说主干，再补细节", "你昨天发的样品 → the samples you sent yesterday。长修饰语放到名词后面。", "Day 20"]
  - ["时间地点「从小到大」，放句尾", "我明天在上海开会 → I have a meeting in Shanghai tomorrow。", "Day 22"]
  - ["名词有可数不可数，没有量词", "两台水壶 → two kettles；一些信息 → some information（不加 s）。", "Day 11"]
  - ["礼貌靠问句，不靠「请」", "请帮我看一下 → Could you take a look? 请 + 命令仍然是命令。", "Day 6, 10, 16"]
  - ["连接词不成对出现", "因为……所以 → because 或 so 二选一；虽然……但是 → although 或 but 二选一。", "Day 18, 23"]
  - ["被动语态用得更多", "货发出去了 → The goods have been shipped。东西做主语时常用被动。", "Day 21"]
  - ["回答问题只看事实", "你不喝咖啡？——对，不喝 → No, I don't。不看对方说得对不对。", "Day 27"]
  - ["语气词要换成句型或语调", "吧 → Let's / right?；呢 → And you? / What if…?；一下 → take a look。", "Day 13, 14, 28"]

