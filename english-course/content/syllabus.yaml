title: 中文思维学商务英语
subtitle: 90 天课程总纲 · 从中专基础到流利说商务英语
title_en: "Business English the Chinese Way · 90-Day Roadmap"
bullets:
  - 3 个阶段 · 90 天 · 每天 2 小时
  - 约 3,000 个高频词与商务词 + 700 多个「拿来就用」的句块
  - 不背单词表、不刷语法题：词在故事里学，语法从中文出发
  - 每天都有口语练习、词汇理解题和参考答案

letter:
  - "你好！"
  - "我在中国教英语很多年了，教过大学生、外贸业务员、工厂老板，也教过只有中专、初中基础，却每天要和老外打交道的人。我发现，中国学生学英语最大的问题从来不是「笨」，也不是「词汇量不够」，而是**学的方法和用的场景对不上**："
  - "背了几千个单词，一开口还是只会 Hello 和 Thank you；语法题做得很好，可客户问一句 You don't drink coffee? 却答反了；知道 didn't 是过去式，却说不清「我不吃早饭」和「我没吃早饭」的区别。"
  - "所以这套课程反过来做：**从你最熟悉的中文出发**。我们不讲「一般过去时」「现在完成时」这些术语，只问一个问题——**这个意思，中文这么说，英文怎么说？为什么？**「了」不等于过去式，「请」不等于 please，「在」有四种说法……你会发现，英语没有你想象的那么难，它只是和中文「想事情的顺序」不一样。"
  - "单词也不用背。每天一集职场短剧，主角 Lily 和你一样，从一个认识简单词、却不敢开口的新人开始，一路接电话、写邮件、报价、谈判、出差美国……常用的几千个词就藏在这些故事里，每个词旁边都写着**怎么读、什么意思、在什么场景下用**。你读懂一个故事，就自然记住了一批词；第二天热身再用一次，复习日再用一次，用过三次的词，就是你的了。"
  - "这套课每天要花两个小时，不轻松。但我向你保证：只要你每天**大声读、大声说、录下来**，90 天后，你会听到一个完全不同的自己。"
  - "我们开始吧。Let's get started!"
letter_sign: "—— 你的英语老师"

principles:
  - ["词在故事里，不在单词表里", "每天一集连续剧，新词放在真实语境里，旁边就是读音、意思和使用场景。研究表明，在「能看懂 95% 以上」的材料里学新词，记得最牢（克拉申的「可理解输入」理论）。"]
  - ["从中文出发，不讲语法术语", "每天一个「中文思维 → 英文表达」对照点：不 / 没、了、过、在、会、要、吧、呢……专治「中式英语」。你不需要知道「虚拟语气」这个词，只需要会说 If I were you, I'd…"]
  - ["学句块，不学单个词", "说英语时，母语者用的是一块一块的「句块」（chunks）：I'll get back to you. / Could you double-check that? 每天 8 个拿来就用的句块，背一句，就能用一句。"]
  - ["每天开口，而且要录音", "每天都有跟读模仿、中译英、情景应答和 1 分钟自述。不说出来的英语，永远只是「认识」，不是「会」。"]
  - ["间隔重复，不靠死记", "第二天热身复习前一天的句子，每周第 7 天是复习日，每 30 天一次阶段复习和测试。按记忆规律安排，不需要额外背诵。"]
  - ["真实商务流程，学了就能用", "故事完整跟随一笔外贸订单：询价 → 报价 → 样品 → 谈价 → 下单 → 生产 → 付款 → 出货 → 出差拜访。你每天学的，就是明天工作里要用的。"]

routine:
  - ["① 热身复习", "10 分钟", "用英文说出前一天的 6 句中文提示。说不出来就翻回前一天。**这是最重要的 10 分钟**。"]
  - ["② 短剧精读 + 词汇", "35 分钟", "每段：先只看英文猜意思 → 看中文核对 → 看下方词表的「使用场景」→ 整段大声读 2 遍。"]
  - ["③ 中文思维对照", "15 分钟", "把表格里每一行的英文大声说 3 遍，特别注意「✗ 中式直译」那一列。"]
  - ["④ 对话跟读 + 发音", "25 分钟", "先练发音小课，再逐句跟读对话（模仿重音和连读），最后分角色自己演一遍并录音。"]
  - ["⑤ 口语练习", "20 分钟", "中译英、情景应答**必须出声说**，说完再看答案；1 分钟自述录音保存。"]
  - ["⑥ 词汇理解题", "15 分钟", "在句子和场景里做题，不考拼写。错题的正确句子读 3 遍、抄下来。"]
split_tip: "上班族可以拆成两段：**早上 1 小时**（① 热身 + ② 短剧 + ③ 中文思维）＋**晚上 1 小时**（④ 对话 + ⑤ 口语 + ⑥ 词汇）。真的很忙的日子，至少做「30 分钟保底版」：热身 + 对话跟读 + 中译英——**一天都不断**，比周末突击 6 小时有效得多。"

before_start:
  - "**录一段「Day 0」音频**：用英文做 1 分钟自我介绍，说多少算多少，哪怕只有三句。存好，30 天后、90 天后各听一次。"
  - "**准备工具**：手机装一个词典 App（欧路或有道，发音选「美式」），手机录音机，一个专门的笔记本。"
  - "**定好时间**：每天固定的两个时间段（例如早上 6:30–7:30、晚上 9:00–10:00），写在日历里。"
  - "**找一个「监督人」**：把打卡表拍照发给家人、朋友或同事，每周给他们看一次进度。"

phases:
  - name: "第一阶段 · 开口期"
    days: "Day 1–30"
    theme: "把「认识的词」变成「说得出口的话」"
    story: "新人 Lily 入职深圳一家小家电出口公司，从接第一个电话，到拿下第一张美国订单，再到飞去芝加哥见客户。"
    words: "780 个词汇卡 + 240 个句块"
    goals:
      - "1 分钟流利地介绍自己、公司和产品"
      - "接打英文电话、记留言，写 5 句左右的商务邮件"
      - "说清报价、样品、交期、付款，应对讨价还价"
      - "独立完成机场、酒店、打车、点餐、拜访客户"
      - "攻克 28 个中文思维点：不 / 没、了、过、在、会、要……"
  - name: "第二阶段 · 流利期"
    days: "Day 31–60"
    theme: "在工作中连续地说、清楚地写"
    story: "Lily 转正后独立负责客户：主持会议、写邮件和报告、处理投诉退货，还要运营公司的亚马逊店铺。"
    words: "约 1,100 个词汇卡 + 240 个句块"
    goals:
      - "主持和参加英文会议：发表观点、同意反对、总结分工"
      - "写跟进邮件、周报月报，用数据描述趋势"
      - "处理客户投诉、质量问题、延误和退货"
      - "看懂并运营跨境电商：产品页、评价、广告、物流"
      - "攻克完成时、情态动词、定语从句、转述等中文思维点"
  - name: "第三阶段 · 进阶期"
    days: "Day 61–90"
    theme: "谈判、演示、社交，像专业人士一样说英语"
    story: "Lily 升职为销售主管：带新人、做产品演示、在展会上开发客户、谈判大单，并在中美文化之间游刃有余。"
    words: "约 1,100 个词汇卡 + 240 个句块"
    goals:
      - "主导一场谈判：开场、让步、处理异议、敲定交易"
      - "用英文做 5 分钟的产品演示，并回答提问"
      - "在展会和社交场合主动搭话、建立人脉、跟进客户"
      - "看懂合同、付款、成本利润、风险等关键条款"
      - "理解中美商务文化差异：饭局、寒暄、拒绝、称赞"

