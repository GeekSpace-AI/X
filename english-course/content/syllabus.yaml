ipa_vowels:
  - ["iː", "see, team, meet", "嘴角向两边拉开，长长的「衣——」"]
  - ["ɪ", "it, sit, business", "短而放松，介于「衣」和「诶」之间"]
  - ["e", "bed, check, yes", "嘴巴半开的「诶」"]
  - ["æ", "bad, traffic, have", "嘴张大、下巴往下掉的「哎」"]
  - ["ɑː", "hot, stop, father", "张大嘴的「啊」（美式 hot 读这个音）"]
  - ["ɔː", "call, coffee, all", "嘴唇收圆的「奥」"]
  - ["ʊ", "book, good, put", "短促的「乌」，嘴唇放松"]
  - ["uː", "food, two, new", "嘴唇撅圆的长「乌——」"]
  - ["ʌ", "cup, budget, money", "短促有力的「阿」"]
  - ["ɜːr", "work, first, person", "舌尖卷起不碰任何地方，拖长"]
  - ["ər", "manager, order, number", "轻读的卷舌音，很短"]
  - ["ə", "about, sofa, the", "最轻最短的「呃」，弱读都是它"]
ipa_diph:
  - ["eɪ", "day, late, sale", "从「诶」滑到「衣」"]
  - ["aɪ", "time, price, nice", "从「啊」滑到「衣」"]
  - ["ɔɪ", "oil, noisy, boy", "从「奥」滑到「衣」"]
  - ["aʊ", "now, how, towel", "从「啊」滑到「乌」"]
  - ["oʊ", "go, phone, cold", "从「欧」滑到「乌」"]
