number: 3
range: "61–90"
title: 第三册 · 工作场景与基础商务沟通
subtitle: 从「能聊下去」到「能把工作说清楚」：职责、流程、数据、客户、系统
title_en: "Book 3 · Day 61–90 · English at Work: Processes, Numbers, Customers and Systems"
series: 中文思维桥接英语 · 180 天课程（共六册）
footer: 中文思维桥接英语 · 第三册 工作场景与基础商务沟通（Day 61–90）
pdf_name: 03-第三册-工作场景与基础商务沟通-Day61-90.pdf
editable_name: 03-第三册-工作场景与基础商务沟通-可编辑版
bullets:
  - 林晓转正后的第三个月：独立负责 20 个美国卖家，讲流程、做周报、回复客户、处理投诉、和西雅图一起排查系统和物流问题
  - 文本里有对话，也有邮件、聊天记录和报告；每天的输出在「口头汇报」和「写工作邮件」之间交替

weeks:
  1: 职责与流程：be responsible for / 被动语态入门
  2: 汇报与数据：数字 · 趋势 · 图表 · 周报
  3: 客户沟通：答复 · 规则 · 道歉 · 拒绝 · 跟进
  4: 系统与物流：权限 · API · 报错 · 异常 · 事故
  5: 综合运用与第三册测评

howto:
  - "第三册从生活回到工作。第一册让你「会说一句」，第二册让你「能聊下去」，第三册要让你**能把工作说清楚**：我负责什么、这件事的流程是什么、这个月的数字说明了什么、客户的问题怎么回、系统出了什么错、包裹为什么没到。"
  - "工作英语和聊天最大的不同，是**先说结论、说得具体、说得礼貌**。中文习惯先铺垫再说重点，英文邮件和汇报往往第一句就说目的；中文说「系统有问题」「货出问题了」，英文要说清**什么时候、做了什么、看到什么、影响谁**；中文说「这个不行」，英文要先表示理解、说明原因、再给替代方案。第三册每天都从这样一个中文习惯出发。"
  - "语法上，第三册重点处理**被动语态**（The order has been shipped. / Refunds are handled by finance.）、**数字和趋势**（increase by / to、percentage point）、**因果**（due to / lead to / as a result）和**条件**（as long as / unless）。第一、二册的薄弱项继续在热身里复现：**每天热身里第一、二册各有一句**。前两册已注释的 1,254 个词和短语，第三册不再重复注释。"
  - "文本从 **约 220 词**增加到 **约 280 词**，除了对话，还有邮件、聊天记录和周报；每天重点学 **约 20 个词和 5 个短语**；Day 67 / 74 / 81 是阶段复习，Day 90 是第三册测评。听力再少一根拐杖：**先不看任何文字听两遍、回答【I】的前两题**，再看英文，只有难句才看中文。"

split_tip: "上班族可以拆成两段：**早上 60 分钟**（第 1–4 步：热身、中文意图、微故事、语音）＋ **晚上 60 分钟**（第 5–8 步：听力、开口、输出、复盘）。特别忙的日子，至少完成**保底 30 分钟**：热身 10 分钟 + 【C】朗读 10 分钟 + 【H】第 3 层 10 分钟，一天都不要断。"

regular_plan:
  - ["旧知识情境复习", 10, "遮住答案，看「热身」里的每句中文，5 秒内用英文说出来（第一、二册各有一句）。说不出的打 ★，翻回原课把那句读 3 遍，再说一次。"]
  - ["中文意图 → 英语表达", 15, "先读【B】，用中文说出这个场景里你要表达的 3 个意思；再学【E】，每组对比例句大声读 3 遍，完成「小任务」后翻到【答案】核对。"]
  - ["微故事与词汇", 25, "【C】第 1 遍只看英文猜意思；第 2 遍逐句对照中文；第 3 遍配合【D】注释弄懂每个重点词；最后遮住中文，把全文（含邮件、消息）大声读 2 遍。"]
  - ["语音训练", 15, "按【G】：每个重点词拍着重音读 5 遍；每个句子按「/」停顿、「‿」连读读 3 遍，特别注意数字、弱读和被动句里的 is / was / been；录下来和手机朗读版对比，找出 1 处不同。"]
  - ["听力训练", 15, "用手机朗读功能（正常语速）播放【C】，按【G】的「四步听法」：①不看文字听两遍，回答【I】前 2 题 ②看英文听 ③只对难句看中文 ④段落听写，再对照原文订正。"]
  - ["开口训练", 20, "【H】三层练习全部出声：第 1 层模仿 3 遍；第 2 层每题至少说 2 个替换版本；第 3 层只看中文情境即兴说，**先说结论，再说细节**，说完再看示范。"]
  - ["输出训练", 12, "完成【H】最后的「今日输出」：口头汇报 1.5–2 分钟（录音），或写一封 6–10 句的工作邮件 / 消息，按日期存档。"]
  - ["当天复盘", 8, "做【I】剩下的检测题并对答案；在「完成清单」打勾；把「明日复习」和「七日后复习」抄进笔记本或手机日历。"]

review_plan:
  - ["旧知识情境复习", 10, "遮住答案，用英文说出「热身」的中文提示。这些句子来自本周不同的日子和前两册，说不出的打 ★。"]
  - ["新情境阅读", 20, "【C】是一个用旧词写成的新情境（常常是一封邮件或一段工作对话）：先遮住中文读 2 遍，看到虚线词（复现词）就停下来回忆意思和第几天学的，再逐句对照中文。"]
  - ["听懂短对话", 15, "用手机朗读功能（正常语速）播放【C】：不看文字听 2 遍，回答【I】的前 2 题；再看英文听一遍核对。"]
  - ["中文意思 → 英文组织", 20, "【H】第 2、3 层：只看中文情境，用本周学过的表达组织英文，先说结论再说细节，先说再写，最后对照示范。"]
  - ["不看原文复述", 15, "合上书，按【H】第 1 层的提示用 8–10 句英文复述【C】的内容，并录音。"]
  - ["易混表达检查", 15, "做【E】的易混表达检查：每组先自己选、说出理由，再对答案；错的那组把正确例句读 5 遍。"]
  - ["输出与自评", 15, "完成【H】的「今日输出」（录音或写邮件），再做【I】剩下的检测题。"]
  - ["下阶段改善", 10, "读本课最后的「下阶段改善建议」，从薄弱项里选 2 个，写进下周每天的热身时间里。"]

listen_steps:
  - ["① 盲听两遍", "正常语速，不看任何文字听两遍，然后回答【I】的前 2 题。"]
  - ["② 看英文听", "打开【C】的英文（不看中文）再听一遍，圈出没听出来的地方——多半是数字、弱读或连读。"]
  - ["③ 难句看中文", "只对圈出来的难句看中文，弄懂后再听一遍这几句。"]
  - ["④ 段落听写", "听写下面指定的句段，再对照原文订正，错的地方读 3 遍。"]

parts:
  - ["A", "今日目标", "今天的场景、要学会的关键表达、词汇范围和**完成标准**——完成标准都写成「能做到什么」，学完自己打勾。"]
  - ["B", "中文场景导入", "先用中文讲清楚：谁和谁沟通、为什么、双方知道什么、你要表达的重点。**先想清楚中文，再学英文。**"]
  - ["C", "英文微故事 / 对话 / 邮件", "原创的工作场景：对话、邮件、聊天记录或周报，**逐句**配中文。S1、S2 是句子编号，绿色加粗的是今天的重点词。"]
  - ["D", "原文重点词汇注释", "按原文出现顺序注释：原文形式、美式音标、**在这句话里的意思**、使用场景、常用搭配、例句、易错点，并标出它在第几句。"]
  - ["E", "中文怎么想，英文怎么说", "每天 3–4 组中英表达差异：中文想表达什么 → 英文自然说法 → 为什么不同 → 什么时候用 → 对比例句 → 小任务。"]
  - ["F", "今日核心表达", "6–8 个拿来就能用的工作句型，标明什么时候用、哪些词可以换、正式和随意场合怎么调整。"]
  - ["G", "语音与听力", "重点词的音节和重音；数字、被动句和弱读；「盲听两遍 → 看英文 → 难句看中文 → 段落听写」。"]
  - ["H", "口语实战", "三层练习：**模仿 → 替换 → 只看中文自主表达**（先说结论再说细节），再加 12 分钟的「今日输出」：口头汇报或工作邮件。全部附示范。"]
  - ["I", "理解检测与复盘", "前 2 题是听力题，其余是「换个场景还会不会用」的迁移题；附答案、完成清单、明日复习和七日后复习。"]

symbols:
  - "**S3** = 【C】第 3 句；注释里的「位置：S3」= 出现在第 3 句；听写「S5–S7」= 第 5 到第 7 句。"
  - "绿色加粗 + 右上角数字 = 今天的重点词，数字对应【D】里的注释编号。"
  - "橙色虚线 + 右上角 **D45** = 复习日里的复现词，D45 表示它是 Day 45 学的（前两册的词也会标出来）。"
  - "音标一律为**美式**（和欧路、有道词典标「美」的音标一致）。`ˈ` 后面的音节读重音，`ˌ` 是次重音，`ː` 表示长音。"
  - "【G】句子里：**加粗** = 句子重音；/ = 停顿；‿ = 连读。"
  - "✗ = 中式直译或常见错误；✓ = 自然的英文说法。"

audio:
  - "**整篇听**：把【C】的英文复制到手机「朗读」功能（iPhone：设置 → 辅助功能 → 朗读内容；安卓：文字转语音）或有道翻译的朗读按钮，选**美式英语**、**正常语速**。"
  - "**单词听**：在欧路词典 / 有道词典 / Cambridge Dictionary 网页版查词，点「美」发音。"
  - "**听真人怎么说**：打开 youglish.com，输入单词或短语（短语加引号），选 US；工作用语可以多听几个不同的人。"
  - "**录音对比**：录下自己的朗读，和朗读版对比，每次只找 1 处不同（重点听数字和 is / was / been 的弱读）。"
  - "**四步听法**：① 盲听两遍 ② 看英文听 ③ 难句看中文 ④ 段落听写。中文只在最后一步、只对难句出现。"

vocab_method:
  - "**首次接触（当天）**：在故事里读懂 → 看【D】注释 → 在【H】和今日输出里用一次。"
  - "**次日回忆**：第二天的热身会用中文提示考你前一天的句子；每课最后列出「明天热身前再看一遍」的内容。"
  - "**一周复习 + 场景再现**：每课列出「七天后复习」；Day 67 / 74 / 81 / 90 用旧词写新情境；附录 1「复现」一栏是程序逐课检索的真实记录。"

setting: "第三册的故事接着第二册：林晓通过试用期，开始**独立负责 20 个美国卖家**。她要给实习生 Leo 讲清楚每天的流程，给卖家写邮件解释订单的全过程，每周给张涛交周报、在月会上讲数据，回复卖家的咨询和投诉、解释赔偿规则、礼貌地拒绝不合理的要求，还要和 IT 的 Kevin、西雅图的 Mike 一起处理账号权限、系统对接、页面报错、物流异常和一次系统宕机。月底，最大的卖家之一 Sarah 第一次来深圳拜访。"
cast:
  - ["Lily Lin 林晓", "主角 · 运营专员（已转正）", "独立负责 20 个美国卖家；这个月要学会讲流程、做汇报、处理投诉、写清楚的邮件。"]
  - ["Tom Zhang 张涛", "运营主管 · 林晓的经理", "要求「先说结论」，会退回写得太长的邮件；季度回顾时给林晓反馈。"]
  - ["Emma Brown", "产品经理", "管功能和产品路线图；卖家想要新功能时，林晓要先找她。"]
  - ["Grace Wu 吴佳", "客服专员", "最熟悉退款、赔偿和客诉规则，教林晓「这个归谁管」。"]
  - ["Kevin Li 李凯", "IT 支持", "管账号和权限：开权限、两步验证、临时访问。"]
  - ["Mike Carter", "西雅图工程经理", "负责系统、API 和事故处理；和深圳只有一小时的重叠工作时间。"]
  - ["Leo 陈乐", "实习生", "林晓带他：学流程、学看板、学写邮件。"]
  - ["Sarah Miller", "卖家 · Pine & Pebble（俄亥俄州家居网店）", "友好、爱提问；月底第一次来深圳拜访。"]
  - ["Daniel Ross", "卖家 · Ross Kicks（得州球鞋店）", "要求多、脾气急，常常一封邮件提五个问题。"]
  - ["Priya Nair", "运营经理 · BrightNest（大卖家）", "做事讲数据，想把自己的系统和 SwiftLink 对接。"]

outcomes:
  - "用英文介绍自己的岗位职责，讲清一个 5–8 步的工作流程（To begin with… / Once that's done… / Finally…）"
  - "用被动语态说明东西和流程：The order has been shipped. / Refunds are handled by finance."
  - "读准大数字、小数、百分比和百分点；用 increase by / to、due to、as a result 说明数据的变化和原因"
  - "做一个 1–2 分钟的周数据汇报：先说结论，再说数据、问题和下一步；被问住时会说 Let me check and get back to you"
  - "回复客户咨询、解释规则、道歉并给出补救、礼貌地拒绝并提出替代方案、礼貌地跟进"
  - "清楚描述一个系统问题或物流异常：做了什么、期望什么、实际发生什么、影响谁"
  - "写一封 6–10 句、目的清楚的工作邮件"
  - "掌握 {WORDS} 个重点词和 {PHRASES} 个短语的语境用法（逐条见附录 1）"

handoff:
  - title: 已学习的表达模式与中文思维点（第四册不再从零讲解，只在新语境中复现和加深）
    list:
      - "**职责与流程**：be responsible for / point of contact / To begin with… Once that's done… Finally…（Day 61、62）"
      - "**被动语态**：is shipped / has been shipped / is handled by / is being held at customs / was detected（Day 63、64、85、86）"
      - "**工作邮件**：I'm writing to… / Please see below / as mentioned / at your earliest convenience / Just following up on… / I was wondering if…（Day 65、80）"
      - "**确认理解**：Just to confirm… / Do you mean…? / In other words… / What you're saying is…（Day 66）"
      - "**数字与趋势**：percentage point / increase by vs to / on average / out of / account for / year over year（Day 68–70）"
      - "**汇报**：Overall… / pending / at risk / next steps；due to / lead to / as a result；off the top of my head / I'd say / take this offline（Day 71–73）"
      - "**客户沟通**：at the moment / free of charge / according to our policy / as long as / unless / We sincerely apologize / I'm afraid we can't… What we can do is… / I hear you / Leave it with me（Day 75–79）"
      - "**系统与物流**：have access to / read-only / integrate with / in real time / go live / steps to reproduce / on my end / held at customs / return to sender / restocking fee（Day 82–88）"
  - title: 已完成的主要情境
    list:
      - "介绍岗位职责、带新人走流程、给卖家解释订单全过程、弄清「谁管什么」并抄送同事"
      - "读数字、讲趋势、讲图表、写周报、解释数据变化的原因、在会上回答问题"
      - "回复咨询、解释赔偿规则、道歉与补救、礼貌拒绝、安抚电话里的愤怒客户、跟进催促"
      - "开权限、讲 API 对接、写 bug 报告、处理物流异常、写事故说明、跨时区交接、讲退货流程、接待来访客户"
  - title: 需要在第四册继续复习的薄弱项目（多数学习者在测评中暴露的问题）
    list:
      - "被动语态漏掉 be 动词或过去分词（✗ Refunds handle by finance. ✗ It was ship yesterday.）；注意电商里常见的 It has shipped. / Ships in 2 days 是固定说法，自己写邮件时用被动更稳"
      - "percent 和 percentage point 混用；increase by / to 用反"
      - "邮件开头仍先寒暄、目的放在最后；结尾套话太多"
      - "拒绝时只说 No / We can't，没有原因和替代方案"
      - "描述问题太笼统（The system has a problem.），缺少「做了什么 → 期望 → 实际」"
      - "第二册的完成时 / 过去时和第一册的第三人称 -s 在快速说话时仍会出错"
  - title: 第四册应新学的内容
    list:
      - "**商务邮件进阶**：请求、跟进、催促、确认、改期的完整邮件；语气的正式程度"
      - "**会议**：开场、发言、同意与反对、打断与澄清、总结行动项；**转述**他人的话（He said that… / She asked whether…）"
      - "**问题说明**：现象 → 原因 → 影响 → 临时方案 → 长期方案"
      - "**方案沟通与项目跟踪**：比较选项、给出建议、推动决策；条件句（If we…, we could…）"
      - "**词汇**：约 520 个新词 + 140 个短语"
  - title: 第四册必须避免的不必要重复
    list:
      - "前三册附录 1 中已注释的词和短语（第三册 {TOTAL} 个）**不再作为新词完整注释**，只在新语境中复现，并标注首次学习日"
      - "第三册已讲透的被动语态、数字读法、趋势表达不再单独成课，只作为热身、复习日和易混检查"
      - "Sarah、Daniel、Priya 的场景可以延续，但换成更复杂的协作任务（跨部门项目、需求变更、延期）"

continue_prompt: |
  你是一名在中国长期生活、熟悉中美文化的资深英语教育专家和课程设计师。请按照《中文思维桥接英语 · 180 天课程》的既定体系，续写【第四册：Day 91–120 商务协作、邮件、会议、问题说明和方案沟通】。

  一、必须沿用的体系（与前三册完全一致）
  1. 每天 120 分钟，8 步：旧知识情境复习 10 → 中文意图到英语表达 15 → 微故事与词汇 25 → 语音 15 → 听力 15 → 开口 20 → 输出 12 → 复盘 8（Day 97 / 104 / 111 / 120 为阶段复习日，用复习日的 8 步结构）。每步写明具体操作。
  2. 每课结构 A–I：A 今日目标；B 中文场景导入（人物关系、沟通目的、已知信息、表达重点）；C 原创对话 / 邮件 / 会议记录，逐句配自然中文，句子编号 S1、S2…；D 按出现顺序的词汇注释（原文形式、原形、词性、美式 IPA、语境语义、使用场景、1–3 个常用搭配、英文例句 + 中文、中国学习者易错点、位置 S#）；E 3–4 组「中文怎么想 → 英文怎么说」；F 6–8 个核心表达；G 语音与听力；H 口语三层（模仿 → 替换 → 只给中文情境的自主表达）+ 今日输出（口头或书面交替）；I 检测题（前 2 题为听力题）+ 答案 + 完成清单 + 明日复习 + 七日后复习。
  3. 每天约 20 个重点词 + 5 个短语，全部自然地出现在当天的文本里；文本从约 240 词逐步增加到约 300 词。
  4. 听力：会议式多人对话；只给英文关键词；边听边记笔记；中文只对难句出现。
  5. 复习日：用旧词写新情境（复现词标注首次学习日）、中文意思组织英文、短对话听力、不看原文复述、易混表达检查、下阶段改善建议。Day 120 提供阶段成果评估、薄弱项目记录和第五册衔接记录。

  二、与前三册的衔接（附件为前三册的 Markdown 源文件，请先读三册的附录 1、2、4）
  1. 三册附录 1 中已注释过的词和短语不再作为新词完整注释，只在新语境中复现，并标注首次学习日。
  2. 第三册的薄弱项目（被动语态、percent / percentage point、邮件先说目的、拒绝时给原因和替代方案、描述问题要具体）要在第四册的热身、练习和复习日中有计划地反复出现。
  3. 继续使用 SwiftLink 的人物：林晓、张涛、Emma、吴佳、李凯、西雅图的 Mike、实习生 Leo，卖家 Sarah、Daniel、Priya；第四册的主线是一个跨部门项目（深圳运营、西雅图工程和美国客户三方协作：延期、系统故障、需求变更）。

  三、第四册重点
  商务邮件进阶（请求、跟进、催促、确认、改期）、会议（开场、发言、同意与反对、打断与澄清、总结行动项）、转述他人的话、问题说明（现象 → 原因 → 影响 → 临时方案 → 长期方案）、方案沟通与项目跟踪（比较选项、给建议、推动决策、条件句）；约 520 个新词 + 140 个短语。

  四、质量要求
  所有对话、邮件原创，不复制影视台词或付费教材；不做语法选择题合集；每个知识点都说明「在什么场景用、为什么这样说、中国人容易错在哪」；IPA 准确；不夸大学习效果；联网资源只给能核实的链接，无法核实的要说明。

  五、交付
  先给出第四册 30 天目录（每天的主题、场景、中英差异点、词汇范围），再逐天写完整教材，最后生成 A4 可打印 PDF 和可编辑源文件，并做完整性检查。
